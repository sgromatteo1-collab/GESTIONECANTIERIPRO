<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="manifest.webmanifest">
<title>Cantiere Pro v4.1</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--panel2:#11233a;--line:#203650;--txt:#edf5ff;--muted:#8ea5bd;--accent:#3ba7ff;--danger:#ff5263;--ok:#4dd49a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{border:0;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;cursor:pointer}
button.primary{background:var(--accent);color:#03101d;border-color:var(--accent);font-weight:700}button.danger{background:#321721;border-color:#63303a}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}aside{border-right:1px solid var(--line);padding:18px;background:#081525;position:sticky;top:0;height:100vh}
.brand{font-size:22px;font-weight:800;margin-bottom:24px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:3px}
nav button{display:block;width:100%;text-align:left;margin:7px 0;background:transparent}.active{background:var(--panel2)!important}
main{min-width:0}.top{min-height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 18px;position:sticky;top:0;background:rgba(7,17,31,.94);backdrop-filter:blur(10px);z-index:5}
.top input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;min-width:80px}
.content{padding:22px;max-width:1500px;margin:auto}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:30px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.card h2,.card h3{margin-top:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.pill{padding:5px 9px;border-radius:999px;background:#10283f;color:#9fd5ff;font-size:12px}
.file{display:flex;align-items:center;justify-content:space-between;gap:12px}.file strong{display:block}.file span{font-size:12px;color:var(--muted)}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:50;padding:20px}.modal.show{display:flex;align-items:center;justify-content:center}.dialog{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(700px,100%);max-height:90vh;overflow:auto;padding:18px}.dialog h2{margin-top:0}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#081525;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px}.field textarea{min-height:120px}
.viewer{position:fixed;inset:0;background:#02070d;z-index:30;display:none;flex-direction:column}.viewer.show{display:flex}
.vtop{display:flex;gap:8px;align-items:center;padding:9px;border-bottom:1px solid var(--line);background:#081525;flex-wrap:wrap}.vtop strong{flex:1;min-width:150px}
.stage{position:relative;flex:1;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start;background:#03080e;touch-action:none}
.pageWrap{position:relative;background:white;box-shadow:0 8px 35px rgba(0,0,0,.35);margin-bottom:30px}
#pdfCanvas{display:block}.drawCanvas{position:absolute;left:0;top:0;touch-action:none}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--line);background:#081525;align-items:center}
.tools label{font-size:12px;color:var(--muted)}.tools input[type=range]{width:100px}
.selected{outline:2px solid var(--accent)}
.pageNav{display:flex;align-items:center;gap:6px;margin-left:auto}.pageNav span{min-width:70px;text-align:center}.zoomNav{display:flex;align-items:center;gap:5px}.zoomNav span{min-width:58px;text-align:center;font-size:12px;color:var(--muted)}
.note{white-space:pre-wrap;color:#dbe8f5}.stat{font-size:25px;font-weight:800}.small{font-size:12px}.mobileMenu{display:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#10283f;border:1px solid var(--line);padding:12px 16px;border-radius:12px;display:none;z-index:100}.toast.show{display:block}
@media(max-width:800px){.app{display:block}aside{display:none}.mobileMenu{display:inline-block}.content{padding:14px}.top{flex-wrap:wrap}.top input{order:5;flex-basis:100%}.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.tools{overflow:auto;flex-wrap:nowrap}.pageNav{margin-left:0}.vtop strong{flex-basis:100%}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand">🏗 Cantiere Pro<small>v4.0 · cantieri + cartelle</small></div>
<nav>
<button class="active" data-section="home">⌂ Dashboard</button>
<button data-section="drawings">📐 Disegni</button>
<button data-section="notes">📝 Note</button>
<button data-section="photos">📷 Foto</button>
<button data-section="issues">🔴 Problemi</button>
<button data-section="revisions">🔄 Revisioni</button>
</nav>
<hr style="border-color:var(--line);border-width:1px 0 0;margin:18px 0">
<button id="siteBtn" style="width:100%">⚙️ Cantiere</button>
<button id="fileHub" style="width:100%;margin-top:8px">☁️ File / iCloud</button>
<button id="backupBtn" style="width:100%;margin-top:8px">⬇️ Backup dati</button>
<button id="restoreBtn" style="width:100%;margin-top:8px">⬆️ Ripristina</button>
</aside>
<main>
<header class="top">
<button class="mobileMenu" id="menuBtn">☰</button>
<input id="search" placeholder="Cerca disegni, note, problemi...">
<button id="addPdf">＋ Disegno</button><button id="importFolder">📥 Importa disegni</button><button id="manageFolders">📁 Cartelle</button><button id="addNote">＋ Nota</button><button id="addPhoto">📷 Foto</button>
<input id="pdfInput" type="file" accept="application/pdf" multiple hidden>
<input id="folderInput" type="file" accept="application/pdf" multiple webkitdirectory directory hidden>
<input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
<input id="restoreInput" type="file" accept="application/json" hidden>
</header>
<section class="content" id="content"></section>
</main></div>

<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<div class="viewer" id="viewer">
<div class="vtop">
<button id="closeViewer">←</button><strong id="viewerTitle"></strong>
<div class="pageNav"><button id="prevPage">‹</button><span id="pageInfo">1 / 1</span><button id="nextPage">›</button></div>
<div class="zoomNav"><button id="zoomOut">−</button><span id="zoomInfo">100%</span><button id="zoomIn">＋</button><button id="zoom100">100%</button><button id="zoomFit">Adatta</button></div>
<button id="revisionBtn" class="primary">💾 Salva REVISIONE</button>
</div>
<div class="stage" id="stage"><div class="pageWrap" id="pageWrap"><canvas id="pdfCanvas"></canvas><canvas id="drawCanvas" class="drawCanvas"></canvas></div></div>
<div class="tools">
<button data-tool="zoom" class="selected">🔍 Zoom</button>
<button data-tool="pen">✏️ Penna</button>
<button data-tool="highlighter">🖍 Evidenziatore</button>
<button data-tool="arrow">➜ Freccia</button>
<button data-tool="circle">○ Cerchio</button>
<button data-tool="text">T Testo</button>
<button data-tool="eraser">⌫ Gomma</button>
<button id="undo">↶ Annulla</button><button id="redo">↷ Ripristina</button><button id="clearInk">Cancella</button>
<label>Spessore <input id="size" type="range" min="1" max="20" value="4"></label>
</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
window.pdfjsLib=pdfjsLib;
const {PDFDocument,rgb}=window.PDFLib;

const KEY="cantiereProV40";
let stored=JSON.parse(localStorage.getItem(KEY)||"null");
if(!stored) stored=JSON.parse(localStorage.getItem("cantiereProV38")||"null");
let store=stored&&Array.isArray(stored.sites)?stored:null;
let db=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function makeFolder(name,parentId=null){return {id:uid(),name,parentId}}
function makeSite(name="Cantiere principale"){return {id:uid(),name:String(name||"Cantiere principale"),folders:[makeFolder("Disegni principali")],drawings:[],notes:[],photos:[],issues:[],revisions:[]}}
function normalizeSite(site){
  if(!site||typeof site!=="object") return makeSite();
  site.id=site.id||uid(); site.name=String(site.name||"Cantiere principale");
  const oldFolders=Array.isArray(site.folders)?site.folders:[];
  const map={};
  const folders=[];
  oldFolders.forEach(f=>{
    if(typeof f==="string") { const nf=makeFolder(f); map[f]=nf.id; folders.push(nf); }
    else if(f&&f.name){ const nf={id:f.id||uid(),name:String(f.name),parentId:f.parentId||null}; map[f.name]=nf.id; folders.push(nf); }
  });
  if(!folders.length) folders.push(makeFolder("Disegni principali"));
  if(!folders.some(f=>f.name==="Disegni principali")) folders.unshift(makeFolder("Disegni principali"));
  site.folders=folders;
  site.drawings=Array.isArray(site.drawings)?site.drawings:[];
  site.drawings.forEach(d=>{
    if(!d.folderId){ const old=d.folder||"Disegni principali"; d.folderId=map[old]||folders.find(f=>f.name===old)?.id||folders[0].id; }
    d.folderId=d.folderId||folders[0].id;
  });
  site.notes=Array.isArray(site.notes)?site.notes:[]; site.photos=Array.isArray(site.photos)?site.photos:[]; site.issues=Array.isArray(site.issues)?site.issues:[]; site.revisions=Array.isArray(site.revisions)?site.revisions:[];
  return site;
}
if(!store){
  const legacy=JSON.parse(localStorage.getItem("cantiereProV32")||"null");
  const site=makeSite(legacy?.site?.name||"Cantiere principale");
  if(legacy){site.drawings=legacy.drawings||[];site.notes=legacy.notes||[];site.photos=legacy.photos||[];site.issues=legacy.issues||[];site.revisions=legacy.revisions||[];}
  store={sites:[site],activeSiteId:site.id};
}
store.sites=(store.sites||[]).map(normalizeSite);
if(!store.sites.length){const site=makeSite();store.sites.push(site);store.activeSiteId=site.id;}
const activeSiteId=store.activeSiteId||store.sites[0].id;
db=store.sites.find(x=>x.id===activeSiteId)||store.sites[0];

let section="home", current=null, pdfDoc=null, pageNum=1, pageCount=1, scale=1, zoom=1, fitZoom=1, tool="zoom", pendingImportFolder=null;
let undoStack=[],redoStack=[],activeStroke=null,last={x:0,y:0},start={x:0,y:0},textMode=false;

const $=id=>document.getElementById(id);
function save(){
  const i=store.sites.findIndex(x=>x.id===db.id);
  if(i>=0)store.sites[i]=db; else store.sites.push(db);
  store.activeSiteId=db.id;
  localStorage.setItem(KEY,JSON.stringify(store));
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2600)}
function openModal(h){$("dialog").innerHTML=h;$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}

function render(){
let q=$("search").value.toLowerCase();
let html=`<div class="hero"><div><h1>${esc(db.name)}</h1><div class="muted">Cantiere attivo · ${db.drawings.length} disegni · ${db.folders.length} cartelle</div></div><div class="row"><button onclick="openSites()">🏗 Cantieri</button><button class="primary" onclick="openImportFolderChooser()">📥 Importa disegni</button></div></div>`;
if(section==="home")html+=`<div class="grid">
<div class="card"><div class="muted">Disegni</div><div class="stat">${db.drawings.length}</div></div>
<div class="card"><div class="muted">Revisioni</div><div class="stat">${db.revisions.length}</div></div>
<div class="card"><div class="muted">Foto</div><div class="stat">${db.photos.length}</div></div>
<div class="card"><div class="muted">Problemi</div><div class="stat">${db.issues.length}</div></div></div><br>
<div class="card"><h3>☁️ File / iCloud Drive</h3><p class="muted">Apri i PDF tramite File → iCloud Drive e salva le revisioni tramite il pannello di condivisione di iPadOS.</p><button class="primary" onclick="openFileHub()">Gestisci File / iCloud</button></div><br>
<div class="card"><h3>Ultimi disegni</h3>${drawingList(q)}</div>`;
else if(section==="drawings")html+=`<div class="card"><div class="row space"><h2>📐 Disegni</h2><div class="row"><button onclick="manageFolders()">📁 Gestisci cartelle</button><button class="primary" onclick="openImportFolderChooser()">📥 Importa disegni</button></div></div>${drawingList(q)}</div>`;
else if(section==="notes")html+=`<div class="card"><div class="row space"><h2>📝 Note</h2><button class="primary" onclick="newNote()">＋ Nuova nota</button></div>${noteList(q)}</div>`;
else if(section==="photos")html+=`<div class="card"><div class="row space"><h2>📷 Foto</h2><button class="primary" onclick="$('photoInput').click()">＋ Scatta / scegli</button></div>${photoList(q)}</div>`;
else if(section==="issues")html+=`<div class="card"><div class="row space"><h2>🔴 Problemi</h2><button class="primary" onclick="newIssue()">＋ Nuovo problema</button></div>${issueList(q)}</div>`;
else if(section==="revisions")html+=`<div class="card"><h2>🔄 Revisioni</h2>${db.revisions.length?db.revisions.slice().reverse().map(r=>`<div class="file card" style="margin:8px 0"><div><strong>${esc(r.name)}</strong><span>${esc(r.base)} · ${esc(r.date)} · ${r.pages||1} pagine</span></div><div class="row"><span class="pill">${esc(r.rev)}</span>${r.data?`<button onclick="downloadData('${r.id}')">Esporta</button>`:""}<button onclick="deleteRevision('${r.id}')" class="danger">Elimina</button></div></div>`).join(""):`<div class="empty">Nessuna revisione.</div>`}</div>`;
$("content").innerHTML=html;
}
function folderById(id){return db.folders.find(f=>f.id===id)||db.folders[0]}
function folderPath(id){const out=[];let f=folderById(id), guard=0;while(f&&guard++<50){out.unshift(f.name);f=f.parentId?folderById(f.parentId):null}return out.join(" / ")}
function childFolders(parentId=null){return db.folders.filter(f=>(f.parentId||null)===(parentId||null)).sort((a,b)=>a.name.localeCompare(b.name))}
function folderTreeHtml(parentId=null,depth=0){return childFolders(parentId).map(f=>{const count=db.drawings.filter(d=>(d.folderId||db.folders[0].id)===f.id).length;return `<div style="padding:8px 0 8px ${depth*22}px;border-bottom:1px solid var(--line)"><div class="row space"><div><strong>📁 ${esc(f.name)}</strong><span>${count} disegni${f.parentId?` · ${esc(folderPath(f.id))}`:""}</span></div>${f.name!=="Disegni principali"?`<button class="danger" onclick="deleteFolder('${f.id}')">Elimina</button>`:""}</div>${folderTreeHtml(f.id,depth+1)}</div>`}).join("")}
function drawingList(q=""){
 let a=db.drawings.filter(x=>(x.name+" "+x.rev+" "+folderPath(x.folderId||db.folders[0].id)).toLowerCase().includes(q));
 if(!a.length)return `<div class="empty">Nessun PDF. Usa “Importa disegni” per scegliere uno o più PDF da File / iCloud Drive.</div>`;
 const groups={}; a.forEach(x=>{const f=folderById(x.folderId)||db.folders[0];const g=f.id;(groups[g]??=[]).push(x)});
 return Object.entries(groups).sort((a,b)=>folderPath(a[0]).localeCompare(folderPath(b[0]))).map(([fid,items])=>`<div class="card" style="margin:10px 0"><div class="row space"><h3 style="margin:0">📁 ${esc(folderPath(fid))}</h3><span class="pill">${items.length} PDF</span></div>${items.map(x=>`<div class="file card" style="margin:8px 0;background:#0a1727"><div><strong>${esc(x.name)}</strong><span>${esc(x.rev||"ORIGINALE")} · ${esc(x.size||"")}</span></div><div class="row"><button onclick="openDrawing('${x.id}')">Apri</button><button onclick="moveDrawing('${x.id}')">📁 Sposta</button><button onclick="exportDrawing('${x.id}')">Esporta</button><button onclick="deleteDrawing('${x.id}')" class="danger">Elimina</button></div></div>`).join("")}</div>`).join("");
}
function noteList(q=""){let a=db.notes.filter(x=>(x.title+" "+x.text).toLowerCase().includes(q));return a.length?a.slice().reverse().map(x=>`<div class="card" style="margin:8px 0"><div class="row space"><strong>${esc(x.title)}</strong><span class="pill">${esc(x.date)}</span></div><p class="note">${esc(x.text)}</p><button onclick="deleteNote('${x.id}')" class="danger">Elimina</button></div>`).join(""):`<div class="empty">Nessuna nota.</div>`}
function photoList(q=""){let a=db.photos.filter(x=>(x.name+" "+x.note).toLowerCase().includes(q));return a.length?a.slice().reverse().map(x=>`<div class="card" style="margin:8px 0"><img src="${x.data}" style="max-width:100%;max-height:260px;border-radius:10px;display:block"><p>${esc(x.name)}</p><div class="muted small">${esc(x.date)} · ${esc(x.note||"")}</div></div>`).join(""):`<div class="empty">Nessuna foto.</div>`}
function issueList(q=""){let a=db.issues.filter(x=>(x.title+" "+x.text+" "+x.status).toLowerCase().includes(q));return a.length?a.slice().reverse().map(x=>`<div class="card" style="margin:8px 0"><div class="row space"><strong>${esc(x.title)}</strong><span class="pill">${esc(x.status)}</span></div><p class="note">${esc(x.text)}</p><button onclick="deleteIssue('${x.id}')" class="danger">Elimina</button></div>`).join(""):`<div class="empty">Nessun problema.</div>`}

function choosePdf(){$("pdfInput").click()}
$("addPdf").onclick=choosePdf;
$("importFolder").onclick=openImportFolderChooser;
$("manageFolders").onclick=manageFolders;
async function importPdfFiles(files, folderId){
  const list=Array.from(files||[]).filter(f=>/\.pdf$/i.test(f.name));
  if(!list.length){toast("Nessun PDF selezionato");return}
  const targetId=folderId||pendingImportFolder||db.folders[0].id;
  const target=folderById(targetId)||db.folders[0];
  for(const f of list){const data=await fileToDataURL(f);db.drawings.push({id:uid(),name:f.name,rev:"ORIGINALE",size:Math.round(f.size/1024)+" KB",folderId:target.id,data});}
  save();section="drawings";render();toast(`${list.length} disegn${list.length===1?"o":"i"} importat${list.length===1?"o":"i"} in ${folderPath(target.id)}.`);
  $("pdfInput").value="";
}
function fileToDataURL(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
$("pdfInput").addEventListener("change",e=>importPdfFiles(e.target.files,pendingImportFolder));
$("folderInput").addEventListener("change",e=>importPdfFiles(e.target.files,pendingImportFolder));
async function openDrawing(id){
current=db.drawings.find(x=>x.id===id);if(!current)return;
$("viewerTitle").textContent=current.name+" · "+(current.rev||"ORIGINALE");
$("viewer").classList.add("show");
undoStack=[];redoStack=[];pageNum=1;
try{pdfDoc=await pdfjsLib.getDocument({data:dataURLToBytes(current.data)}).promise;pageCount=pdfDoc.numPages;zoom=1;await renderPage(true)}catch(e){console.error(e);toast("Impossibile aprire il PDF");closeViewer()}
}
function dataURLToBytes(url){let b=atob(url.split(",")[1]);let a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function renderPage(resetFit=false){
let page=await pdfDoc.getPage(pageNum);
let base=page.getViewport({scale:1});
let maxW=Math.min(window.innerWidth-30,1050);
fitZoom=Math.max(.5,Math.min(1.75,maxW/base.width));
if(resetFit) zoom=fitZoom;
zoom=Math.max(.5,Math.min(4,zoom));
scale=zoom;
let vp=page.getViewport({scale});
let dpr=Math.min(3,window.devicePixelRatio||1);
let pc=$("pdfCanvas"),dc=$("drawCanvas"),wrap=$("pageWrap");
pc.width=Math.round(vp.width*dpr);pc.height=Math.round(vp.height*dpr);pc.style.width=vp.width+"px";pc.style.height=vp.height+"px";
dc.width=Math.round(vp.width*dpr);dc.height=Math.round(vp.height*dpr);dc.style.width=vp.width+"px";dc.style.height=vp.height+"px";
wrap.style.width=vp.width+"px";wrap.style.height=vp.height+"px";
let pctx=pc.getContext("2d",{alpha:false});
pctx.setTransform(dpr,0,0,dpr,0,0);
await page.render({canvasContext:pctx,viewport:vp}).promise;
redraw();$("pageInfo").textContent=`${pageNum} / ${pageCount}`;$("zoomInfo").textContent=Math.round(zoom*100)+"%";
}
function point(e){let r=$("drawCanvas").getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function setTool(next){
  tool=next;
  document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("selected",x.dataset.tool===tool));
  const drawing=tool!=="zoom";
  $("drawCanvas").style.pointerEvents=drawing?"auto":"none";
  $("stage").style.touchAction=drawing?"none":"pan-x pan-y";
}
function finishToZoom(){if(tool!=="zoom")setTool("zoom")}
function begin(e){
  if(tool==="zoom")return;
  if(tool==="text"){
    let p=point(e);let t=prompt("Testo da inserire:");
    if(t){pushAction({type:"text",x:p.x,y:p.y,text:t,size:Math.max(14,+$("size").value*3)});redraw()}
    finishToZoom();return;
  }
  $("drawCanvas").setPointerCapture(e.pointerId);let p=point(e);start=p;last=p;activeStroke={type:tool,points:[p],size:+$("size").value};
}
function move(e){if(!activeStroke)return;let p=point(e);if(tool==="pen"||tool==="highlighter"||tool==="eraser")activeStroke.points.push(p);last=p;redrawTemp()}
function end(){if(!activeStroke)return;if((tool==="arrow"||tool==="circle")&&start.x===last.x&&start.y===last.y){activeStroke=null;redraw();finishToZoom();return}pushAction(activeStroke);activeStroke=null;redraw();finishToZoom()}
function redrawTemp(){redraw();if(!activeStroke)return;drawAction($("drawCanvas").getContext("2d"),activeStroke)}
function pushAction(a){undoStack.push({page:pageNum,action:a});redoStack=[]}
function redraw(){let c=$("drawCanvas"),ctx=c.getContext("2d"),dpr=Math.min(3,window.devicePixelRatio||1);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,c.width/dpr,c.height/dpr);undoStack.filter(x=>x.page===pageNum).forEach(x=>drawAction(ctx,x.action));if(activeStroke)drawAction(ctx,activeStroke)}
function drawAction(ctx,a){
ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=a.size||4;
if(a.type==="highlighter"){ctx.globalAlpha=.25;ctx.strokeStyle="#ffe45e";ctx.lineWidth=Math.max(12,(a.size||4)*4);drawPath(ctx,a.points)}
else if(a.type==="pen"){ctx.strokeStyle="#ff3f67";drawPath(ctx,a.points)}
else if(a.type==="eraser"){ctx.globalCompositeOperation="destination-out";ctx.lineWidth=Math.max(20,(a.size||4)*4);drawPath(ctx,a.points)}
else if(a.type==="arrow"){ctx.strokeStyle="#ff3f67";ctx.lineWidth=a.size||4;ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2);ctx.stroke();let ang=Math.atan2(a.y2-a.y1,a.x2-a.x1),len=12+a.size*2;ctx.beginPath();ctx.moveTo(a.x2,a.y2);ctx.lineTo(a.x2-len*Math.cos(ang-.5),a.y2-len*Math.sin(ang-.5));ctx.moveTo(a.x2,a.y2);ctx.lineTo(a.x2-len*Math.cos(ang+.5),a.y2-len*Math.sin(ang+.5));ctx.stroke()}
else if(a.type==="circle"){ctx.strokeStyle="#ff3f67";ctx.beginPath();let cx=(a.x1+a.x2)/2,cy=(a.y1+a.y2)/2,rx=Math.abs(a.x2-a.x1)/2,ry=Math.abs(a.y2-a.y1)/2;ctx.ellipse(cx,cy,Math.max(2,rx),Math.max(2,ry),0,0,Math.PI*2);ctx.stroke()}
else if(a.type==="text"){ctx.fillStyle="#d71945";ctx.font=`700 ${a.size||18}px -apple-system,BlinkMacSystemFont,sans-serif`;ctx.fillText(a.text,a.x,a.y)}
ctx.restore()}
function drawPath(ctx,pts){if(!pts||!pts.length)return;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke()}
$("drawCanvas").addEventListener("pointerdown",begin);$("drawCanvas").addEventListener("pointermove",move);$("drawCanvas").addEventListener("pointerup",end);$("drawCanvas").addEventListener("pointercancel",()=>{activeStroke=null;redraw();finishToZoom()});

async function createRevision(){
if(!current||!pdfDoc)return;
let same=db.revisions.filter(r=>r.baseId===current.id);
let n=same.length+1,rev="REV"+String(n).padStart(2,"0");
let original=await PDFDocument.load(dataURLToBytes(current.data));
let pages=original.getPages();
let actionsByPage={};undoStack.forEach(x=>(actionsByPage[x.page]??=[]).push(x.action));
let exported=0;
for(let p=1;p<=pages.length;p++){
 let actions=actionsByPage[p]||[];
 if(!actions.length)continue;
 let c=document.createElement("canvas");let page=pages[p-1];let pdfW=page.getWidth(),pdfH=page.getHeight();
 let factor=2; c.width=Math.max(1,Math.round(pdfW*factor));c.height=Math.max(1,Math.round(pdfH*factor));
 let ctx=c.getContext("2d");
 let cssW=$("drawCanvas").clientWidth||$("drawCanvas").width, cssH=$("drawCanvas").clientHeight||$("drawCanvas").height;
 ctx.scale(c.width/cssW,c.height/cssH);
 actions.forEach(a=>drawAction(ctx,a));
 let png=await original.embedPng(c.toDataURL("image/png"));
 page.drawImage(png,{x:0,y:0,width:pdfW,height:pdfH});exported++;
}
let bytes=await original.save();
let blob=new Blob([bytes],{type:"application/pdf"});
let data=await blobToDataURL(blob);
let name=current.name.replace(/\.pdf$/i,"")+"_"+rev+".pdf";
const revisionId=uid();
db.revisions.push({id:revisionId,baseId:current.id,base:current.name,rev,name,date:new Date().toLocaleString("it-IT"),pages:pages.length,annotatedPages:exported,data});
save();
current={...current,id:uid(),revisionId,name,rev,size:Math.round(blob.size/1024)+" KB",data};
db.drawings.push(current);save();
downloadBlob(blob,name);
toast(`${rev} creato. Il PDF è stato esportato.`);
render();
}
function setZoom(z){zoom=Math.max(.5,Math.min(4,z));renderPage(false)}
$("zoomIn").onclick=()=>setZoom(zoom+0.25);
$("zoomOut").onclick=()=>setZoom(zoom-0.25);
$("zoom100").onclick=()=>setZoom(1);
$("zoomFit").onclick=()=>{zoom=fitZoom;renderPage(false)};
let pinchStart=0,pinchZoom=1,pinchLast=0;
$("stage").addEventListener("touchstart",e=>{
  if(tool!=="zoom")return;
  if(e.touches.length===2){e.preventDefault();let dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pinchStart=Math.hypot(dx,dy);pinchZoom=zoom;}
},{passive:false});
$("stage").addEventListener("touchmove",e=>{
  if(tool!=="zoom"||e.touches.length!==2||!pinchStart)return;
  e.preventDefault();let dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;let dist=Math.hypot(dx,dy);let z=Math.max(.5,Math.min(4,pinchZoom*(dist/pinchStart)));
  zoom=z;$("zoomInfo").textContent=Math.round(zoom*100)+"%";
  const now=performance.now();if(now-pinchLast>90){pinchLast=now;renderPage(false)}
},{passive:false});
$("stage").addEventListener("touchend",e=>{if(e.touches.length<2)pinchStart=0},{passive:false});
$("stage").addEventListener("wheel",e=>{if(tool==="zoom"&&(e.ctrlKey||e.metaKey)){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:.9))}}, {passive:false});

function blobToDataURL(blob){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}
function downloadBlob(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportDrawing(id){let d=db.drawings.find(x=>x.id===id);if(!d)return;let bin=atob(d.data.split(",")[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);downloadBlob(new Blob([u],{type:"application/pdf"}),d.name)}
function downloadData(id){let r=db.revisions.find(x=>x.id===id);if(!r)return;let bin=atob(r.data.split(",")[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);downloadBlob(new Blob([u],{type:"application/pdf"}),r.name)}
function deleteRevision(id){
 const r=db.revisions.find(x=>x.id===id);
 if(!r)return;
 if(!confirm(`Eliminare la revisione ${r.rev} di ${r.base}?\n\nIl PDF della revisione verrà rimosso anche dall'elenco Disegni dell'app.`))return;
 const before=db.revisions.length;
 db.revisions=db.revisions.filter(x=>x.id!==id);
 db.drawings=db.drawings.filter(d=>{
   if(d.revisionId===id)return false;
   return !(d.rev===r.rev && d.name===r.name && d.data===r.data);
 });
 save();
 if(current && (current.revisionId===id || (current.name===r.name && current.rev===r.rev))) current=null;
 render();
 toast(before!==db.revisions.length ? `${r.rev} eliminata.` : 'Revisione non trovata.');
}

function openSites(){openModal(`<h2>🏗 Gestione cantieri</h2><p class="muted">Crea, rinomina e seleziona i tuoi cantieri. Il nome viene salvato automaticamente.</p><div class="card" style="margin:10px 0">${store.sites.map(x=>`<div class="file" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><strong>${esc(x.name)}</strong><span>${x.drawings.length} disegni · ${x.folders.length} cartelle</span></div><div class="row">${x.id===db.id?'<span class="pill">ATTIVO</span>':`<button onclick="switchSite('${x.id}')">Apri</button>`}<button onclick="renameSite('${x.id}')">Rinomina</button>${store.sites.length>1?`<button class="danger" onclick="deleteSite('${x.id}')">Elimina</button>`:""}</div></div>`).join('')}</div><h3>＋ Nuovo cantiere</h3><div class="field"><label>Nome cantiere</label><input id="newSiteName" placeholder="Es. Cantiere Via Roma"></div><div class="row" style="justify-content:flex-end"><button onclick="closeModal()">Chiudi</button><button class="primary" onclick="createSite()">Crea cantiere</button></div>`)}

function renameSite(id){const site=store.sites.find(x=>x.id===id);if(!site)return;openModal(`<h2>✏️ Rinomina cantiere</h2><div class="field"><label>Nome cantiere</label><input id="renameSiteName" value="${esc(site.name)}"></div><div class="row" style="justify-content:flex-end"><button onclick="openSites()">Annulla</button><button class="primary" onclick="saveSiteName('${id}')">Salva nome</button></div>`)}

function createFolder(){const n=$("folderName").value.trim();const parentId=$("folderParent").value||null;if(!n){toast("Inserisci il nome della cartella");return}if(db.folders.some(f=>f.name.toLowerCase()===n.toLowerCase()&&(f.parentId||null)===(parentId||null))){toast("Cartella già esistente in questa posizione");return}db.folders.push(makeFolder(n,parentId));save();manageFolders();render();toast(parentId?`Sotto-cartella "${n}" creata.`:`Cartella "${n}" creata.`)}
